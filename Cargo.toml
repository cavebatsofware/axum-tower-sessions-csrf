[package]
name = "axum-tower-sessions-csrf"
version = "0.1.3"
edition = "2021"
authors = ["Grant DeFayette"]
license = "MIT OR LGPL-3.0-or-later"
description = "CSRF protection for Axum using tower-sessions with the Synchronizer Token Pattern"
repository = "https://github.com/cavebatsofware/axum-tower-sessions-csrf"
keywords = ["axum", "csrf", "tower-sessions", "security", "middleware"]
categories = ["web-programming", "authentication"]
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", default-features = false }
tower-sessions = "0.15.0"
rand = "0.10.1"
hex = "0.4.3"
tracing = { version = "0.1.44", optional = true }

[features]
default = ["tracing"]
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { version = "1.51.1", features = ["macros", "rt"] }
tower-sessions-memory-store = "0.15.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
